Biped_Robot_Master_controller:
  # Publish all joint states -----------------------------------
  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 50

  # Position Controllers --------------------------------------
  J01_Left_Hip_Roll_Y_position_controller:
    type: effort_controllers/JointPositionController
    joint: J01_Left_Hip_Roll_Y
    pid: {p: 100.0, i: 0.01, d: 10.0}
  J02_Left_Hip_Pitch_X_position_controller:
    type: effort_controllers/JointPositionController
    joint: J02_Left_Hip_Pitch_X
    pid: {p: 100.0, i: 0.01, d: 10.0}
  J03_Left_Knee_Pitch_X_position_controller:
    type: effort_controllers/JointPositionController
    joint: J03_Left_Knee_Pitch_X
    pid: {p: 100.0, i: 0.01, d: 10.0}
  J04_Left_Ankle_Pitch_X_position_controller:
    type: effort_controllers/JointPositionController
    joint: J04_Left_Ankle_Pitch_X
    pid: {p: 100.0, i: 0.01, d: 10.0}
  J05_Right_Hip_Roll_Y_position_controller:
    type: effort_controllers/JointPositionController
    joint: J05_Right_Hip_Roll_Y
    pid: {p: 100.0, i: 0.01, d: 10.0}
  J06_Right_Hip_Pitch_X_position_controller:
    type: effort_controllers/JointPositionController
    joint: J06_Right_Hip_Pitch_X
    pid: {p: 100.0, i: 0.01, d: 10.0}
  J07_Right_Knee_Pitch_X_position_controller:
    type: effort_controllers/JointPositionController
    joint: J07_Right_Knee_Pitch_X
    pid: {p: 100.0, i: 0.01, d: 10.0}
  J08_Right_Ankle_Pitch_X_position_controller:
    type: effort_controllers/JointPositionController
    joint: J08_Right_Ankle_Pitch_X
    pid: {p: 100.0, i: 0.01, d: 10.0}
